<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>마루2011 생산 대시보드</title>
<style>
:root {
  --bg: #07090e;
  --bg2: #0b1018;
  --panel: #101722;
  --panel2: #141c29;
  --line: #263244;
  --line2: #35465c;
  --text: #eef3f9;
  --muted: #8b9cb3;
  --faint: #5c6d84;
  --gold: #e4b44c;
  --gold2: #c4922a;
  --red: #ff5d5d;
  --redbg: rgba(255,93,93,.12);
  --amber: #f5b942;
  --amberbg: rgba(245,185,66,.12);
  --cyan: #3ecfc4;
  --cyanbg: rgba(62,207,196,.1);
  --green: #4ade80;
  --t3: #6ea8ff;
  --t5: #c084fc;
  --sym: #fb7185;
  --dis: #34d399;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
  --side: 212px;
  --header: 64px;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  min-height: 100vh;
  letter-spacing: -0.01em;
}
button, input { font-family: inherit; }
.num, .kpi-val, td.qty, .chip-n { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.app {
  display: grid;
  grid-template-columns: var(--side) 1fr;
  grid-template-rows: var(--header) 1fr;
  min-height: 100vh;
}
.top {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px 0 18px;
  background: linear-gradient(180deg, #121a26 0%, #0d141e 100%);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
}
.top::before {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, var(--gold), #7a5a18 40%, var(--cyan) 100%);
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 9px; flex: none;
  background: linear-gradient(145deg, #2a2416, #16120c);
  border: 1px solid #5a4718;
  display: grid; place-items: center;
  color: var(--gold); font-weight: 800; font-size: 13px; letter-spacing: -0.04em;
}
.brand-text h1 {
  margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2;
}
.brand-text p {
  margin: 1px 0 0; font-size: 11px; color: var(--muted); letter-spacing: 0;
}

.fold-nav { display:flex; gap:8px; margin-left:18px; align-items:center; }
.fold-nav a {
  display:inline-flex; align-items:center;
  border:1px solid var(--line2); background:#0c121b; color:var(--text);
  border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700;
  text-decoration:none;
}
.fold-nav a:hover { border-color:var(--gold); color:var(--gold); }

.top-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line2); background: #0c121b;
  border-radius: 999px; padding: 5px 10px; font-size: 11px; color: var(--muted);
}
.badge b { color: var(--text); font-weight: 700; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

.side {
  background: var(--bg2);
  border-right: 1px solid var(--line);
  padding: 14px 10px 24px;
  position: sticky; top: var(--header); height: calc(100vh - var(--header));
  overflow: auto;
}
.side-label {
  font-size: 10px; color: var(--faint); letter-spacing: .14em; text-transform: uppercase;
  padding: 6px 10px 8px;
}
.nav-btn {
  width: 100%; display: flex; align-items: center; gap: 8px;
  text-align: left; border: 0; background: transparent; color: var(--muted);
  border-radius: 10px; padding: 9px 10px; cursor: pointer; margin-bottom: 3px;
}
.nav-btn:hover { background: #182232; color: var(--text); }
.nav-btn.active {
  background: linear-gradient(90deg, rgba(228,180,76,.16), rgba(228,180,76,.04));
  color: var(--text);
  box-shadow: inset 3px 0 0 var(--gold);
}
.nav-btn .nav-name { flex: 1; font-size: 13.5px; font-weight: 700; }
.nav-btn .nav-sub { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-btn.active .nav-sub { color: var(--gold); }
.side-foot { margin-top: 18px; padding: 10px; font-size: 10.5px; color: var(--faint); line-height: 1.5; }

.main {
  padding: 18px 20px 40px;
  min-width: 0;
  background:
    radial-gradient(1200px 400px at 100% 0%, rgba(62,207,196,.05), transparent 50%),
    var(--bg);
}

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.03em; }
.page-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 10px; min-width: 220px;
}
.search input {
  background: transparent; border: 0; outline: 0; color: var(--text); width: 180px; font-size: 13px;
}
.search input::placeholder { color: var(--faint); }

.kpis { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px 13px; position: relative; overflow: hidden; box-shadow: var(--shadow);
}
.kpi::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.kpi.c-gold::after { background: var(--gold); }
.kpi.c-cyan::after { background: var(--cyan); }
.kpi.c-red::after { background: var(--red); }
.kpi.c-amber::after { background: var(--amber); }
.kpi.c-t5::after { background: var(--t5); }
.kpi.c-muted::after { background: var(--line2); }
.kpi.c-green::after { background: var(--green); }
.kpi.c-t3::after { background: var(--t3); }
.kpi .k { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.kpi .kpi-val { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
.kpi .u { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.kpi .d { font-size: 11px; color: var(--faint); margin-top: 6px; }

.alerts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
.alert {
  border-radius: var(--radius); padding: 13px 14px 14px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow);
  color: inherit;
}
.alert:hover { border-color: var(--line2); filter: brightness(1.06); }
.alert.crit { background: linear-gradient(180deg, #231316, #161018); border-color: #5a2a32; }
.alert.warn { background: linear-gradient(180deg, #231c10, #16140f); border-color: #5a4520; }
.alert.info { background: linear-gradient(180deg, #102028, #10161c); border-color: #1e4a52; }
.alert .tag {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em;
  padding: 2px 7px; border-radius: 999px; margin-bottom: 8px;
}
.alert.crit .tag { background: var(--redbg); color: var(--red); }
.alert.warn .tag { background: var(--amberbg); color: var(--amber); }
.alert.info .tag { background: var(--cyanbg); color: var(--cyan); }
.alert h3 { margin: 0 0 6px; font-size: 14.5px; }
.alert p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.alert .pcs { color: var(--text); font-weight: 800; }

.mix, .pipe, .table-card, .note-card, .cal-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sec-h h3 { margin: 0; font-size: 13px; letter-spacing: .04em; }
.sec-h span { font-size: 11px; color: var(--faint); }

.mix-bar { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: #0a0e14; }
.mix-bar > i { display: block; height: 100%; }
.mix-leg { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 10px; }
.mix-leg button {
  background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 0;
  display: flex; align-items: center; gap: 6px; font-size: 12.5px;
}
.mix-leg button:hover { color: var(--text); }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.mix-leg b { color: var(--text); font-weight: 700; }

.pipe-row { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.pipe-node {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 11px;
  position: relative; min-height: 108px;
}
.pipe-node.empty { border-style: dashed; background: transparent; }
.pipe-node .st { font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
.pipe-node.empty .st { color: var(--faint); }
.pipe-node .pv { font-size: 20px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.03em; }
.pipe-node .pd { font-size: 11px; color: var(--muted); line-height: 1.4; }
.pipe-node .src { font-size: 10px; color: var(--faint); margin-top: 6px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.pill {
  border: 1px solid var(--line); background: #0c121b; color: var(--muted);
  border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer;
}
.pill.on { border-color: var(--gold2); color: var(--gold); background: rgba(228,180,76,.1); }

.table-wrap { overflow: auto; max-height: calc(100vh - 220px); border: 1px solid var(--line); border-radius: 10px; }
table.data { width: 100%; border-collapse: collapse; min-width: 1380px; font-size: 12.5px; }
table.data th {
  position: sticky; top: 0; z-index: 2;
  background: #1a2433; color: var(--muted); font-weight: 700; font-size: 11px;
  text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line2);
  white-space: nowrap;
}
table.data td { padding: 8px 10px; border-bottom: 1px solid #1c2736; vertical-align: top; }
table.data tbody tr:hover { background: #182232; }
table.data td.no {
  position: sticky; left: 0; background: var(--panel); font-weight: 800; white-space: nowrap; z-index: 1;
}
table.data tbody tr:hover td.no { background: #182232; }
table.data td.qty { text-align: right; font-weight: 700; white-space: nowrap; }
table.data .due.overdue { color: var(--red); font-weight: 800; }
table.data .due.soon { color: var(--amber); font-weight: 800; }
table.data .empty { color: var(--faint); }
table.data .note { color: var(--muted); max-width: 240px; }
table.data .color { max-width: 220px; color: #d5deea; }
table.data .style { max-width: 200px; }
.row-overdue { box-shadow: inset 3px 0 0 var(--red); }
.row-soon { box-shadow: inset 3px 0 0 var(--amber); }
.row-fab { box-shadow: inset 3px 0 0 var(--cyan); }

.team-tag {
  display: inline-block; font-size: 10.5px; font-weight: 700;
  padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line);
  white-space: nowrap;
}

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

.banner {
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.45;
  border: 1px solid var(--line);
}
.banner.crit { background: var(--redbg); border-color: #5a2a32; color: #ffd0d0; }
.banner.warn { background: var(--amberbg); border-color: #5a4520; color: #ffe7b0; }
.banner.info { background: var(--cyanbg); border-color: #1e4a52; color: #c6f4f0; }

.hidden { display: none !important; }
.mobile-nav { display: none; }


.jikji-link {
  color: var(--cyan); font-weight: 700; font-size: 11.5px;
  text-decoration: none; border-bottom: 1px dashed rgba(62,207,196,.45);
}
.jikji-link:hover { color: #7eefe6; }

.foot {
  color: var(--faint); font-size: 11px; line-height: 1.5; padding: 4px 2px 20px;
}

.thumb-cell { width: 72px; padding: 6px 8px !important; vertical-align: middle !important; }
.thumb {
  width: 64px; height: 64px; border-radius: 8px; object-fit: cover; object-position: top center;
  display: block; cursor: zoom-in; border: 1px solid var(--line2); background: #0a0e14;
}

.thumb-cell { width: 108px; }
.thumb.art-square {
  width: 96px; height: 96px; border-radius: 8px;
  object-fit: cover; object-position: 50% 42%;
  display: block; cursor: zoom-in; border: 1px solid var(--line2); background: #0a0e14;
}
.thumb.art-full {
  width: 120px; height: 150px; border-radius: 6px;
  object-fit: contain; object-position: center;
  display: block; cursor: zoom-in; border: 1px solid var(--line2); background: #f4f1ea;
}
.lb.mode-square img {
  width: min(560px, 86vw); height: min(560px, 86vw);
  object-fit: cover; object-position: 50% 42%;
}
.lb.mode-full img {
  max-width: min(1100px, 96vw); max-height: calc(100vh - 110px);
  width: auto; height: auto; object-fit: contain; background: #f4f1ea;
}
.chapter-hero img.art-square { width: 96px; height: 96px; object-fit: cover; object-position: 50% 42%; }
.chapter-hero img.art-full { width: 140px; height: 180px; object-fit: contain; background: #f4f1ea; }
.brand-chip img.art-square { width: 48px; height: 48px; object-fit: cover; object-position: 50% 42%; }
.brand-chip img.art-full { width: 48px; height: 60px; object-fit: contain; background: #f4f1ea; }

.thumb:hover { border-color: var(--gold2); box-shadow: 0 0 0 2px rgba(228,180,76,.25); }
.thumb-ph {
  width: 64px; height: 64px; border-radius: 8px;
  display: grid; place-items: center; text-align: center;
  background: #0c121b; border: 1px dashed var(--line);
  color: var(--faint); font-size: 9px; font-weight: 700; letter-spacing: .02em; line-height: 1.3;
}
.thumb-kind {
  display: block; font-size: 9px; color: var(--faint); margin-top: 3px; text-align: center; letter-spacing: .04em;
}

.brand-strip {
  display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 8px; margin-bottom: 14px;
}
.brand-chip {
  display: flex; align-items: center; gap: 8px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 7px 9px; cursor: pointer; color: inherit; box-shadow: var(--shadow);
}
.brand-chip:hover { border-color: var(--line2); filter: brightness(1.06); }
.brand-chip img, .brand-chip .chip-ph {
  width: 44px; height: 44px; border-radius: 8px; object-fit: cover; object-position: top center;
  flex: none; border: 1px solid var(--line);
}
.brand-chip .chip-ph { background: #0c121b; }
.brand-chip .bn { font-size: 12px; font-weight: 800; line-height: 1.2; }
.brand-chip .bs { font-size: 10px; color: var(--faint); margin-top: 2px; }

.chapter-hero {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.chapter-hero img {
  width: 72px; height: 72px; border-radius: 10px; object-fit: cover; object-position: top center;
  border: 1px solid var(--line2); cursor: zoom-in; flex: none;
}
.chapter-hero .ch-t { font-size: 13px; font-weight: 800; }
.chapter-hero .ch-s { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

.cal-grid {
  display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px;
}
.cal-dow { font-size: 10px; color: var(--faint); text-align: center; padding: 2px 0 4px; letter-spacing: .08em; }
.cal-day {
  min-height: 72px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel2); padding: 6px 7px; font-size: 11px;
}
.cal-day.off { background: transparent; border-style: dashed; opacity: .45; }
.cal-day.today { border-color: var(--gold2); box-shadow: inset 0 0 0 1px rgba(228,180,76,.25); }
.cal-day .dn { font-weight: 800; color: var(--muted); }
.cal-day .ev { margin-top: 4px; font-size: 10.5px; color: var(--text); line-height: 1.35; }
.cal-day .ev b { color: var(--gold); }

.lb {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(4,7,12,.88); display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px 16px 20px;
  cursor: zoom-out;
}
.lb.hidden { display: none !important; }
.lb img {
  max-width: min(1100px, 96vw); max-height: calc(100vh - 110px);
  object-fit: contain; border-radius: 8px; box-shadow: 0 12px 48px rgba(0,0,0,.55);
  cursor: default; background: #111;
}
.lb-cap { margin-top: 12px; text-align: center; max-width: 90vw; cursor: default; }
.lb-cap b { display: block; font-size: 14px; }
.lb-cap span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.lb-x {
  position: absolute; top: 12px; right: 14px;
  background: #0c121b; color: var(--text); border: 1px solid var(--line2);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12px;
}

@media (max-width: 1400px) {
  .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); }
}
@media (max-width: 1280px) {
  .alerts { grid-template-columns: 1fr; }
  .pipe-row { grid-template-columns: 1fr 1fr; }
  .pipe-row .pipe-node:last-child { grid-column: 1 / -1; }
  .brand-strip { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
  .side { display: none; }
  .mobile-nav {
    display: flex; gap: 6px; overflow: auto; padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line); background: var(--bg2);
    position: sticky; top: var(--header); z-index: 30;
  }
  .mobile-nav .nav-btn { width: auto; flex: none; white-space: nowrap; margin: 0; padding: 8px 12px; }
  .mobile-nav .nav-sub { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .main { padding: 12px 12px 32px; }
  .brand-text h1 { font-size: 15px; }
  .top { padding: 10px 12px; height: auto; min-height: var(--header); flex-wrap: wrap; }
  .table-wrap { max-height: none; }
  .search { min-width: 0; width: 100%; }
  .search input { width: 100%; }
  .cal-grid { grid-template-columns: repeat(7, minmax(0,1fr)); }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi .kpi-val { font-size: 22px; }
  .pipe-row { grid-template-columns: 1fr; }
  .pipe-row .pipe-node:last-child { grid-column: auto; }
  .brand-strip { grid-template-columns: 1fr 1fr; }
  .thumb, .thumb-ph { width: 56px; height: 56px; }
}
</style>
<script src="/maru-dashboard/js/auth-gate.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-mark">M</div>
    <div class="brand-text">
      <h1>마루2011 생산 대시보드</h1>
      <p>티셔츠 공장 생산관리 · 본사 대구 · 열람 부산</p>
    </div>
    <nav class="fold-nav">
  <a href="../index.html">폴더홈</a>
  <a href="../goodtrust/index.html">GOODTRUST</a>
  <a href="./index.html" class="on">생산현황</a>
  <span class="nolink">마감</span>
  <a href="../process/index.html">공정</a>
  <a href="../education/index.html">교육자료</a>
</nav>
    <div class="top-meta" id="topMeta"></div>
  </header>

  <nav class="side" id="sideNav"></nav>
  <nav class="mobile-nav" id="mobileNav"></nav>

  <main class="main">
    <div class="page-head">
      <div>
        <h2 id="title">전체</h2>
        <div class="sub" id="subtitle"></div>
      </div>
      <label class="search">
        <span style="color:var(--faint);font-size:12px;">찾기</span>
        <input id="q" type="search" placeholder="NO · 브랜드 · 스타일 · 칼라 · 비고" autocomplete="off">
      </label>
    </div>

    <div id="homeExtra"></div>
    <div id="teamBanner"></div>

    <div class="table-card">
      <div class="sec-h">
        <h3 id="tableTitle">작지 목록</h3>
        <span id="tableCount"></span>
      </div>
      <div class="filters" id="filters"></div>
      <div class="table-wrap">
        <table class="data" id="tbl">

const CAL_DAILY = DATA.calDaily || [];

let chapter = "all";
let riskFilter = "all";

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(n) {
  if (n == null || n === "") return "";
  return Number(n).toLocaleString("ko-KR");
}
function fmtOrDash(n) {
  if (n == null || n === "") return "—";
  return Number(n).toLocaleString("ko-KR");
}
function dueClass(days) {
  if (days == null) return "";
  if (days < 0) return "overdue";
  if (days <= 7) return "soon";
  return "";
}
function styleOf(o) {
  const a = (o.styleCode || "").trim();
  const b = (o.styleName || "").trim();
  if (a && b) return a + " · " + b;
  return a || b || "";
}
function dash(s) {
  if (!s) return "<span class=\"empty\">—</span>";
  return esc(s);
}
function fabricCell(o) {
  if (o.fabricToday) {
    return esc(o.fabric || META.asOf) + " <span class=\"empty\">당일</span>";
  }
  if (o.fabric) return esc(o.fabric);
  return "<span class=\"empty\">—</span>";
}
function cutCell(o) {
  const d = o.cutDate || "";
  const q = o.cutQty;
  if (!d && q == null) return "<span class=\"empty\">—</span>";
  if (d && q == null) return esc(d);
  if (!d && q != null) return fmt(q);
  return esc(d) + " · " + fmt(q);
}
function imgPath(file) { return "../img/" + file; }

function artKind(o) {
  const t = (o && o.team) || "";
  const b = String((o && o.brand) || "").toUpperCase();
  if (t === "디즈니" || b.indexOf("디즈니") >= 0 || b.indexOf("DISNEY") >= 0) return "full";
  return "square";
}
function artKindFile(file, fallbackTeam) {
  const f = String(file || "").toLowerCase();
  if (f.indexOf("disney") >= 0 || fallbackTeam === "디즈니") return "full";
  return "square";
}

function lbTitle(o) {
  const st = styleOf(o);
  const bits = [o.no, o.brand];
  if (st) bits.push(st);
  if (o.color) bits.push(o.color);
  return bits.join(" · ");
}
function thumbCell(o) {
  const im = IMG_MAP[o.no];
  if (!im) {
    return '<td class="thumb-cell"><div class="thumb-ph">작지없음</div></td>';
  }
  const title = lbTitle(o);
  const ak = artKind(o);
  return '<td class="thumb-cell">' +
    '<img class="thumb art-' + ak + '" src="' + imgPath(im.file) + '" alt="' + esc(im.kind) + '" ' +
    'data-art="' + ak + '" data-lb="' + esc(im.file) + '" data-lb-title="' + esc(title) + '" data-lb-src="' + esc(im.src) + '">' +
    '<span class="thumb-kind">' + esc(im.kind) + "</span></td>";
}
function openLb(file, title, src) {
  const box = document.getElementById("lb");
  const img = document.getElementById("lbImg");
  img.src = imgPath(file);
  img.alt = title || "";
  document.getElementById("lbTitle").textContent = title || "";
  document.getElementById("lbSrc").textContent = "작지 출처 · " + (src || file);
  box.className = "lb mode-" + (artKindFile(file));
  box.classList.remove("hidden");
}
function closeLb() {
  document.getElementById("lb").classList.add("hidden");
  document.getElementById("lbImg").removeAttribute("src");
}
function teamTag(team) {
  const c = TEAM_COLOR[team] || "var(--muted)";
  return '<span class="team-tag" style="color:' + c + ';border-color:' + c + '">' + esc(team) + "</span>";
}
function brandStripHtml() {
  return '<div class="brand-strip">' + BRAND_STRIP.map(function (b) {
    return '<button class="brand-chip" data-go="' + esc(b.go) + '">' +
      '<img class="art-' + artKindFile(b.file, b.go) + '" src="' + imgPath(b.file) + '" alt="' + esc(b.name) + '">' +
      '<span><span class="bn">' + esc(b.name) + '</span><div class="bs">' + esc(b.sub) + "</div></span></button>";
  }).join("") + "</div>";
}
function chapterHeroHtml(id) {
  const h = TEAM_HERO[id];
  if (!h) return "";
  return '<div class="chapter-hero">' +
    '<img class="art-' + artKindFile(h.file, id) + '" src="' + imgPath(h.file) + '" alt="' + esc(h.title) + '" ' +
    'data-art="' + artKindFile(h.file, id) + '" data-lb="' + esc(h.file) + '" data-lb-title="' + esc(h.title) + '" data-lb-src="' + esc(h.src) + '">' +
    '<div><div class="ch-t">' + esc(h.title) + '</div><div class="ch-s">' + esc(h.cap) + " · " + esc(h.kind) + "</div></div></div>";
}
function kpiCard(cls, k, val, unit, d) {
  return '<div class="kpi ' + cls + '"><div class="k">' + k + '</div><div class="kpi-val">' +
    val + (unit ? '<span class="u">' + unit + "</span>" : "") + '</div><div class="d">' + d + "</div></div>";
}
function kpisHtml(m, label) {
  const fabLine = m.fabTodayN
    ? "미입고 " + fmt(m.fabMissN) + " · 당일 " + fmt(m.fabTodayN)
    : "미입고 " + fmt(m.fabMissN) + "건 · 당일 없음";
  const soonLine = m.soonN ? fmt(m.soonQ) + " PCS" : "해당 없음";
  const completeVal = m.completeN ? fmt(m.completeN) : "<span style='font-size:18px'>미입력</span>";
  const completeD = m.completeN ? fmt(m.completeQ) + " PCS" : "작지 완성칸 공란";
  return '<div class="kpis">' +
    kpiCard("c-gold", "오더 건수", fmt(m.n), "NO", label || "색상 단위 작지") +
    kpiCard("c-cyan", "총수량", fmt(m.qty), "PCS", "공란 수량은 합계에서 제외") +
    kpiCard("c-red", "납기 경과", "<span style='color:var(--red)'>" + fmt(m.overdueN) + "</span>", "건", fmt(m.overdueQ) + " PCS") +
    kpiCard("c-amber", "납기 7일 이내", "<span style='color:var(--amber)'>" + fmt(m.soonN) + "</span>", "건", soonLine) +
    kpiCard("c-t5", "원단 미입고/당일", fmt(m.fabMissN), "건", fabLine) +
    kpiCard("c-t3", "재단 완료", fmt(m.cutN), "NO", "재단수량 합 " + (m.cutQtySum ? fmt(m.cutQtySum) : "—")) +
    kpiCard("c-green", "봉제투입", fmt(m.sewN), "건", m.sewN ? fmt(m.sewQ) + " PCS" : "일자만 기록 · 수량 공란 가능") +
    kpiCard("c-muted", "완성", completeVal, m.completeN ? "건" : "", completeD) +
  "</div>";
}
function alertsHtml() {
  const overdue = ORDERS.filter(function (o) { return o.days != null && o.days < 0; })
    .sort(function (a, b) { return a.days - b.days || b.qty - a.qty; });
  const soon = ORDERS.filter(function (o) { return o.days != null && o.days >= 0 && o.days <= 7; });
  const fab = ORDERS.filter(function (o) { return o.fabricIssue; });
  const byTeam = {};
  overdue.forEach(function (o) {
    if (!byTeam[o.team]) byTeam[o.team] = { n: 0, q: 0, days: o.days, due: o.due };
    byTeam[o.team].n += 1;
    byTeam[o.team].q += (o.qty || 0);
    if (o.days < byTeam[o.team].days) { byTeam[o.team].days = o.days; byTeam[o.team].due = o.due; }
  });
  const teamAlerts = Object.keys(byTeam).sort(function (a, b) { return byTeam[a].days - byTeam[b].days; });
  const cards = [];
  teamAlerts.slice(0, 2).forEach(function (t, i) {
    const x = byTeam[t];
    cards.push(
      '<button class="alert crit" data-go="' + esc(t) + '"><span class="tag">ALERT 0' + (i + 1) + "</span>" +
      "<h3>" + esc(t) + " · 납기 경과</h3><p>납기 <b>" + esc(x.due) + "</b> · D+" + Math.abs(x.days) +
      "<br><span class=\"pcs\">" + fmt(x.q) + " PCS</span> / " + x.n + " NO</p></button>"
    );
  });
  if (soon.length) {
    const q = soon.reduce(function (a, o) { return a + (o.qty || 0); }, 0);
    cards.push(
      '<button class="alert warn" data-go="risk"><span class="tag">ALERT</span>' +
      "<h3>납기 7일 이내</h3><p>" + soon.length + " NO · <span class=\"pcs\">" + fmt(q) + " PCS</span></p></button>"
    );
  }
  if (fab.length && cards.length < 3) {
    const miss = fab.filter(function (o) { return o.fabricMissing; });
    const q = miss.reduce(function (a, o) { return a + (o.qty || 0); }, 0);
    cards.push(
      '<button class="alert info" data-go="risk"><span class="tag">ALERT 0' + (cards.length + 1) + "</span>" +
      "<h3>원단 미입고</h3><p>" + miss.length + " NO · <span class=\"pcs\">" + fmt(q) +
      " PCS</span><br>원단 이슈 전체 " + fab.length + "건 (비고·예정 포함)</p></button>"
    );
  }
  if (!cards.length) return "";
  return '<div class="alerts">' + cards.slice(0, 3).join("") + "</div>";
}
function mixHtml() {
  const t = META.teams || {};
  const total = META.qty || 1;
  function pct(q) { return (q / total * 100).toFixed(1); }
  const bar = TEAM_ORDER.map(function (name) {
    const q = (t[name] && t[name].qty) || 0;
    const c = TEAM_COLOR[name] || "var(--muted)";
    return '<i style="width:' + pct(q) + "%;background:" + c + '" title="' + esc(name) + '"></i>';
  }).join("");
  const leg = TEAM_ORDER.map(function (name) {
    const x = t[name] || { n: 0, qty: 0 };
    const c = TEAM_COLOR[name] || "var(--muted)";
    return '<button data-go="' + esc(name) + '"><span class="sw" style="background:' + c + '"></span>' +
      esc(name) + " <b>" + fmt(x.qty) + "</b> · " + x.n + " NO · " + pct(x.qty) + "%</button>";
  }).join("");
  return '<div class="mix"><div class="sec-h"><h3>팀별 수량 구성</h3><span>클릭하면 해당 챕터</span></div>' +
    '<div class="mix-bar">' + bar + '</div><div class="mix-leg">' + leg + "</div></div>";
}
function pipeHtml(scopeLabel, cal, calN, monthCal, monthN, inboundN) {
  const inN = (inboundN == null ? META.inboundN : inboundN);
  const nodes = [
    ["01 재단", cal["재단"], calN["재단"], "스케줄 누적수량", ""],
    ["02 부속 (바스)", cal["부속"], calN["부속"], "스케줄 누적 · 바스 기준", ""],
    ["03 합봉 (에리후세)", cal["합봉"], calN["합봉"], "스케줄 누적 · 에리후세 기준", ""],
    ["04 완성", cal["완성"], calN["완성"], "스케줄 누적", ""],
    ["05 입고", inN, inN, "작지 입고일 기록 건수", ""],
    ["06 출고", META.shipN || 0, META.shipN || 0, "작지 출고일 기록 건수", "팀 시트 출고일 · 없으면 공란"]
  ];
  const row = nodes.map(function (n, i) {
    const empty = !n[1];
    const monthBit = monthCal && n[0].indexOf("입고") < 0
      ? (["재단","부속","합봉","완성"][i] ? " · " + META.month + " " + fmt(monthCal[["재단","부속","합봉","완성"][i]] || 0) : "")
      : "";
    return '<div class="pipe-node' + (empty ? " empty" : "") + '"><div class="st">' + n[0] + "</div>" +
      '<div class="pv">' + (n[1] ? fmt(n[1]) : "—") + "</div>" +
      '<div class="pd">' + n[2] + "개 행에 수량" + monthBit + (n[3] ? "<br>" + n[3] : "") +
      (n[4] ? "<br>" + n[4] : "") + '</div><div class="src">출처: ' + scopeLabel + "</div></div>";
  }).join("");
  return '<div class="pipe"><div class="sec-h"><h3>공정 파이프라인</h3><span>재단 → 부속(바스) → 합봉(에리후세) → 완성 → 입고 → 출고 · 공란은 미입력</span></div>' +
    '<div class="pipe-row">' + row + "</div></div>";
}
function monthCalHtml(teamFilter) {
  const month = META.month || (META.asOf || "").slice(0, 7);
  if (!month) return "";
  const y = +month.slice(0, 4), mo = +month.slice(5, 7);
  const first = new Date(y, mo - 1, 1);
  const lastDate = new Date(y, mo, 0).getDate();
  const startDow = first.getDay(); // 0 sun
  const byDay = {};
  CAL_DAILY.forEach(function (e) {
    if (teamFilter && e.team !== teamFilter) return;
    if (e.date.slice(0, 7) !== month) return;
    const dd = e.date.slice(8, 10);
    if (!byDay[dd]) byDay[dd] = {};
    byDay[dd][e.proc] = (byDay[dd][e.proc] || 0) + e.qty;
  });
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div class="cal-day off"></div>');
  for (let d = 1; d <= lastDate; d++) {
    const ds = String(d).padStart(2, "0");
    const iso = month + "-" + ds;
    const isToday = iso === META.asOf;
    const ev = byDay[ds] || {};
    const keys = ["재단","부속","합봉","완성"].filter(function (k) { return ev[k]; });
    const evHtml = keys.map(function (k) { return k + " <b>" + fmt(ev[k]) + "</b>"; }).join("<br>");
    cells.push('<div class="cal-day' + (isToday ? " today" : "") + '"><div class="dn">' + d +
      (isToday ? " · 오늘" : "") + "</div>" + (evHtml ? '<div class="ev">' + evHtml + "</div>" : "") + "</div>");
  }
  const dow = ["일","월","화","수","목","금","토"].map(function (x) {
    return '<div class="cal-dow">' + x + "</div>";
  }).join("");
  const mCal = META.calMonth || {};
  const hasAny = ["재단","부속","합봉","완성"].some(function (k) { return mCal[k]; });
  return '<div class="cal-card"><div class="sec-h"><h3>' + month + " 생산스케줄</h3><span>" +
    (hasAny ? ("합봉 " + fmt(mCal["합봉"] || 0) + " · 재단 " + fmt(mCal["재단"] || 0) + " · 완성 " + fmt(mCal["완성"] || 0))
      : "이달 칸에 수량이 없습니다 (공란 유지)") +
    '</span></div><div class="cal-grid">' + dow + cells.join("") + "</div></div>";
}

function teamKpisAndSched(team) {

  const cal = { "재단": tc["재단"], "부속": tc["부속"], "합봉": tc["합봉"], "완성": tc["완성"] };
  const calN = { "재단": tc["재단N"], "부속": tc["부속N"], "합봉": tc["합봉N"], "완성": tc["완성N"] };

  }
  return kpisHtml(META, "전 팀 · 작지 기준") +

}

function setChapter(id) {
  chapter = id;
  riskFilter = "all";
  document.getElementById("q").value = "";
  if (history.replaceState) history.replaceState(null, "", "#" + encodeURIComponent(id));
  render();
}
function currentRows() {
  let rows = ORDERS.slice();
  if (chapter === "risk") {
    rows = rows.filter(function (o) {
      return (o.days != null && o.days < 0) || (o.days != null && o.days >= 0 && o.days <= 7) || o.fabricIssue;
    });
    if (riskFilter === "overdue") rows = rows.filter(function (o) { return o.days != null && o.days < 0; });
    if (riskFilter === "soon") rows = rows.filter(function (o) { return o.days != null && o.days >= 0 && o.days <= 7; });
    if (riskFilter === "fab") rows = rows.filter(function (o) { return o.fabricIssue; });
    rows.sort(function (a, b) {
      function rank(o) {
        if (o.days != null && o.days < 0) return 0;
        if (o.days != null && o.days >= 0 && o.days <= 7) return 1;
        if (o.fabricIssue) return 2;
        return 3;
      }
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      if ((a.days == null ? 999 : a.days) !== (b.days == null ? 999 : b.days)) {
        return (a.days == null ? 999 : a.days) - (b.days == null ? 999 : b.days);
      }
      return (a.no < b.no) ? -1 : (a.no > b.no ? 1 : 0);
    });
  } else if (chapter === "공정") {
    rows.sort(function (a, b) {
      const sa = a.complete ? 3 : (a.sewDate ? 2 : (a.cutDate || a.cutQty != null ? 1 : 0));
      const sb = b.complete ? 3 : (b.sewDate ? 2 : (b.cutDate || b.cutQty != null ? 1 : 0));
      if (sa !== sb) return sb - sa;
      return a.no < b.no ? -1 : 1;
    });
  } else if (chapter !== "all") {
    rows = rows.filter(function (o) { return o.team === chapter; });
  }
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  if (q) {
    rows = rows.filter(function (o) {
      const blob = [o.no, o.team, o.brand, o.styleCode, o.styleName, o.color, o.note, o.due, o.po].join(" ").toLowerCase();
      return blob.indexOf(q) >= 0;
    });
  }
  return rows;
}

function teamBanner() {
  if (TEAM_ORDER.indexOf(chapter) >= 0) {
    const tk = (META.teamKpis || {})[chapter] || {};
    const bits = [];
    if (tk.overdueN) bits.push("납기 경과 " + tk.overdueN + "건 " + fmt(tk.overdueQ) + " PCS");
    if (tk.soonN) bits.push("7일 이내 " + tk.soonN + "건");
    if (tk.fabMissN) bits.push("원단 미입고 " + tk.fabMissN + "건");
    if (tk.completeN) bits.push("완성일 기록 " + tk.completeN + "건");
    const cls = tk.overdueN ? "crit" : (tk.soonN || tk.fabMissN ? "warn" : "info");
    const msg = bits.length ? bits.join(" · ") : (fmt(tk.n) + " NO · " + fmt(tk.qty) + " PCS");
    return chapterHeroHtml(chapter) + '<div class="banner ' + cls + '">' + msg + "</div>";
  }
  if (chapter === "risk") {
    return '<div class="banner crit">기준일 ' + esc(META.asOf) + " 대비 · 경과 " + META.overdueN + "건 " +
      fmt(META.overdueQ) + " PCS · 7일 이내 " + META.soonN + "건 · 원단 이슈 " + META.fabIssueN + "건</div>";
  }
  if (chapter === "공정") {
    return '<div class="banner info">' + esc(META.month) + " 스케줄 일자 칸 합계 · 재단 " +
      fmt((META.calMonth || {})["재단"] || 0) + " · 부속 " + fmt((META.calMonth || {})["부속"] || 0) +
      " · 합봉 " + fmt((META.calMonth || {})["합봉"] || 0) + " · 완성 " + fmt((META.calMonth || {})["완성"] || 0) +
      " · 숫자는 캘린더에 적힌 값만</div>";
  }
  return "";
}
function filtersHtml() {
  if (chapter !== "risk") return "";
  const items = [
    ["all", "전체 리스크"],
    ["overdue", "납기 경과"],
    ["soon", "7일 이내"],
    ["fab", "원단 이슈"]
  ];
  return items.map(function (it) {
    return '<button class="pill' + (riskFilter === it[0] ? " on" : "") + '" data-rf="' + it[0] + '">' + it[1] + "</button>";
  }).join("");
}

function jikjiCell(o) {
  const url = o && o.jikjiUrl;
  if (!url) return "<td class=\"empty\">—</td>";
  const label = o.jikjiName ? String(o.jikjiName).replace(/\.pdf$/i, "") : "열기";
  const short = label.length > 18 ? label.slice(0, 16) + "…" : label;
  return "<td><a class=\"jikji-link\" href=\"" + esc(url) + "\" title=\"" + esc(o.jikjiRel || o.jikjiName || "") + "\" target=\"_blank\" rel=\"noopener\">" + esc(short) + "</a></td>";
}
function matCell(o) {
  const url = o && o.matUrl;
  if (!url) return "<td class=\"empty\">—</td>";
  const label = o.matName ? String(o.matName).replace(/\.xlsx?$/i, "") : "자재";
  const short = label.length > 16 ? label.slice(0, 14) + "…" : label;
  return "<td><a class=\"jikji-link\" href=\"" + esc(url) + "\" title=\"" + esc(o.matRel || o.matName || "") + "\" target=\"_blank\" rel=\"noopener\">" + esc(short) + "</a></td>";
}

function jikjiExtra() {
  const idx = DATA.jikjiIndex || {};
  const teams = Object.keys(idx.byTeam || {});
  if (!teams.length) return '<div class="card"><p>연결된 작업지시서 PDF가 아직 없습니다.</p></div>';
  let html = '<div class="card"><p>현황표 작지에 매칭된 PDF · ' + (META.jikjiLinked || 0) + ' / ' + (META.n || 0) + ' · 창고 ' + (META.jikjiFiles || 0) + '개</p></div>';
  teams.forEach(function (team) {
    const brands = idx.byTeam[team] || {};
    html += '<div class="card"><h3 style="margin:0 0 8px;font-size:14px">' + esc(team) + '</h3>';
    Object.keys(brands).sort().forEach(function (brand) {
      const files = brands[brand] || [];
      html += '<div style="margin:8px 0 4px;color:var(--gold);font-size:12px;font-weight:700">' + esc(brand || "(브랜드미상)") + ' · ' + files.length + '</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      files.slice(0, 40).forEach(function (f) {
        html += '<a class="pill jikji-link" href="' + esc(f.url) + '" title="' + esc(f.rel || f.name) + '" target="_blank" rel="noopener">' + esc((f.name || "").replace(/\.pdf$/i, "").slice(0, 28)) + '</a>';
      });
      if (files.length > 40) html += '<span class="empty">+' + (files.length - 40) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}

function renderTable(rows) {
  const tb = document.getElementById("tbody");
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="17" class="empty" style="padding:22px;text-align:center">해당하는 작지가 없습니다.</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(function (o) {
    const dc = dueClass(o.days);
    const rowc = (o.days != null && o.days < 0) ? "row-overdue" : (dc === "soon" ? "row-soon" : (o.fabricIssue ? "row-fab" : ""));
    const dueTxt = o.due
      ? esc(o.due) + (o.days != null && o.days < 0 ? " · D+" + Math.abs(o.days) : (o.days != null && o.days <= 7 ? " · D-" + o.days : ""))
      : "<span class=\"empty\">—</span>";
    const st = styleOf(o);
    return "<tr class=\"" + rowc + "\">" +
      "<td class=\"no\">" + esc(o.no) + "</td>" +
      thumbCell(o) +
      jikjiCell(o) +
      matCell(o) +
      "<td>" + teamTag(o.team) + "</td>" +
      "<td>" + dash(o.brand) + "</td>" +
      "<td class=\"style\">" + (st ? esc(st) : "<span class=\"empty\">—</span>") + "</td>" +
      "<td class=\"color\">" + (o.color ? esc(o.color) : "<span class=\"empty\">—</span>") + "</td>" +
      "<td class=\"qty\">" + (o.qty == null ? "<span class=\"empty\">—</span>" : fmt(o.qty)) + "</td>" +
      "<td class=\"due " + dc + "\">" + dueTxt + "</td>" +
      "<td>" + fabricCell(o) + "</td>" +
      "<td>" + cutCell(o) + "</td>" +
      "<td>" + dash(o.sewDate) + "</td>" +
      "<td>" + dash(o.complete) + "</td>" +
      "<td>" + dash(o.inbound) + "</td>" +
      "<td>" + dash(o.ship) + "</td>" +
      "<td class=\"note\">" + (o.note ? esc(o.note) : "<span class=\"empty\">—</span>") + "</td>" +
    "</tr>";
  }).join("");
}
function titles() {
  const map = {
    all: ["전체", META.n + " 칼라웨이 · " + (META.qty || 0).toLocaleString("ko-KR") + " PCS · 기준일 " + META.asOf],
    risk: ["납기리스크", "경과 · 7일 이내 · 원단 이슈"],
    "공정": ["공정", (META.month || "") + " 스케줄 · 재단/부속/합봉/완성/입고"],
    "작지": ["작지PDF · 자재", "브랜드 · 팀별 작업지시서 · 자재리스트 링크"]
  };
  TEAM_ORDER.forEach(function (t) {
    const x = (META.teams || {})[t] || {};
    map[t] = [t, (x.n || 0) + " NO · " + (x.qty || 0).toLocaleString("ko-KR") + " PCS"];
  });
  const t = map[chapter] || map.all;
  document.getElementById("title").textContent = t[0];
  document.getElementById("subtitle").textContent = t[1];
  const tableTitles = { risk: "리스크 작지", "공정": "작지 공정 현황", "작지": "작지 매칭 목록" };
  document.getElementById("tableTitle").textContent = tableTitles[chapter] || "작지 목록";
}
function bindGo(root) {
  if (!root) return;
  Array.prototype.forEach.call(root.querySelectorAll("[data-go]"), function (el) {
    el.onclick = function () { setChapter(el.getAttribute("data-go")); };
  });
}
function bindLb(root) {
  if (!root) return;
  Array.prototype.forEach.call(root.querySelectorAll("[data-lb]"), function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      openLb(el.getAttribute("data-lb"), el.getAttribute("data-lb-title"), el.getAttribute("data-lb-src"));
    };
  });
}
function render() {
  renderNav();
  titles();
  const extra = document.getElementById("homeExtra");
  if (chapter === "all") {
    extra.innerHTML = homeExtra();
    extra.classList.remove("hidden");
    bindGo(extra);
  } else if (TEAM_ORDER.indexOf(chapter) >= 0) {
    extra.innerHTML = teamKpisAndSched(chapter);
    extra.classList.remove("hidden");
    bindGo(extra);
  } else if (chapter === "공정") {
    extra.innerHTML = processExtra();
    extra.classList.remove("hidden");
    bindGo(extra);
  } else if (chapter === "작지") {
    extra.innerHTML = jikjiExtra();
    extra.classList.remove("hidden");
    bindGo(extra);
  } else {
    extra.innerHTML = "";
    extra.classList.add("hidden");
  }
  document.getElementById("teamBanner").innerHTML = teamBanner();
  const flt = document.getElementById("filters");
  flt.innerHTML = filtersHtml();
  Array.prototype.forEach.call(flt.querySelectorAll("[data-rf]"), function (btn) {
    btn.onclick = function () { riskFilter = btn.getAttribute("data-rf"); render(); };
  });
  const rows = currentRows();
  const pcs = rows.reduce(function (a, o) { return a + (o.qty || 0); }, 0);
  document.getElementById("tableCount").textContent = rows.length + " NO · " + pcs.toLocaleString("ko-KR") + " PCS";
  renderTable(rows);
  bindLb(document.getElementById("tbl"));
  bindLb(document.getElementById("teamBanner"));
  bindLb(document.getElementById("homeExtra"));
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("lb").addEventListener("click", function (e) {
  if (e.target.id === "lb" || e.target.id === "lbX") closeLb();
});
document.getElementById("lbX").addEventListener("click", function (e) {
  e.stopPropagation();
  closeLb();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeLb();
});
window.addEventListener("hashchange", function () {
  const h = decodeURIComponent((location.hash || "#all").slice(1)) || "all";
  const ids = TEAMS.map(function (t) { return t.id; });
  if (ids.indexOf(h) >= 0) { chapter = h; render(); }
});
(function init() {
  document.getElementById("topMeta").innerHTML =
    '<span class="badge"><span class="dot"></span>스냅샷 <b>' + esc(META.asOf) + "</b></span>" +
    '<span class="badge">출처 <b>' + esc(META.source) + "</b></span>" +
    '<span class="badge">file:// 로컬</span>';
  document.getElementById("foot").textContent =
    "마루2011 · 기준일 " + META.asOf + " · " + META.n + " NO / " + (META.qty || 0).toLocaleString("ko-KR") +
    " PCS · 서버 없이 Chrome에서 index.html을 더블클릭하면 됩니다. 도식화는 ../img 상대경로. " +
    "숫자는 " + META.source + " 추출분이며 작지에 없는 수량은 만들지 않았습니다.";
  const h = decodeURIComponent((location.hash || "#all").slice(1)) || "all";
  const ids = TEAMS.map(function (t) { return t.id; });
  if (ids.indexOf(h) >= 0) chapter = h;
  render();
})();
</script>
<script src="../_shared/fold-nav.js" defer></script>
</body>

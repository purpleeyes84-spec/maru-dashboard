<script>

const D=JSON.parse(document.getElementById("DATA").textContent);
const fmt=n=>(n==null||n==="")?"—":Number(n).toLocaleString("ko-KR",{maximumFractionDigits:1});
const O=D.overall||{}, M=D.month||{}, W=D.week_compare||{};
function fmtI(n){if(n==null||n==="")return "—";return Math.round(Number(n)).toLocaleString("ko-KR");}
function dlab(iso){
  if(!iso) return "";
  const wd=["월","화","수","목","금","토","일"];
  const d=new Date(iso+"T00:00:00");
  if(isNaN(d)) { const p=iso.split("-"); return (p[1]|0)+"/"+ (p[2]|0); }
  return (d.getMonth()+1)+"/"+d.getDate()+"·"+wd[(d.getDay()+6)%7];
}
document.getElementById("defs").innerHTML=
  `<b>일평균</b> = ${D.defs["일평균_제품생산량"]}<br>`+
  `<b>조업일</b> = ${D.defs["조업일"]}<br>`+
  `<b>일지장수</b> = ${D.defs["일지장수"]}<br>`+
  `<b>주간</b> = ${D.defs["주간"]}<br>`+
  `<b>삼봉</b> = ${D.defs["삼봉"]||""}`;
document.getElementById("kpis").innerHTML=`
  <div class="kpi"><div class="lbl">이번달 일평균</div><div class="val">${fmt(M.line_avg)}</div><div class="meta">${M.label||""} · 조업 ${fmt(M.조업일||M.unique_days)}일</div></div>
  <div class="kpi"><div class="lbl">전체 일평균</div><div class="val">${fmt(O.line_avg)}</div><div class="meta">조업 ${fmt(O.조업일||O.unique_days)}일 · ${O.date_range||""}</div></div>
  <div class="kpi"><div class="lbl">금주 vs 완료주평균</div><div class="val">${(W.비교&&W.비교.금주_대비!=null)?((W.비교.금주_대비>=0?"+":"")+fmtI(W.비교.금주_대비)):"—"}</div><div class="meta">금주 ${fmtI(W.이번주_일평균)} · 완료주 ${fmtI((W.비교||{}).완료주_평균)} · ${(W.금주_진행||{}).진행||""}</div></div>
  <div class="kpi"><div class="lbl">1주전 일평균</div><div class="val">${fmtI((W.weeks||[]).find(w=>w.주==="1주전")?.일평균)}</div><div class="meta">${((W.weeks||[]).find(w=>w.주==="1주전")||{}).기간약||""}</div></div>`;

function cell(v){return v==null||v===""?"—":fmtI(v);}
const weeks=W.weeks||[];
const rows=weeks.map(w=>{
  const y=w.요일별||{};
  const mark=w.금주?' <span class="badge info">금주</span>':"";
  return `<tr><td>${w.주||""}${mark}</td><td>${w.기간약||""}</td><td class="num"><b>${cell(w.일평균)}</b></td>`+
    ["월","화","수","목","금","토"].map(k=>`<td class="num">${cell(y[k])}</td>`).join("")+`</tr>`;
}).join("");
const C=W.비교||{}, G=W.금주_진행||{};
const prog=(G.days||[]).map(d=>{
  const q=d.수량!=null?`<b>${fmtI(d.수량)}</b>`:"—";
  const st=d.상태||"";
  const bc=st==="기록"?"ok":(st==="미기록"?"warn":(st==="예정"?"info":""));
  const badge=bc?`<span class="badge ${bc}">${st}</span>`:st;
  return `<tr><td>${d.요일}</td><td>${d.날짜약||""}</td><td>${badge}</td><td class="num">${q}</td></tr>`;
}).join("");
const vs=C.금주_대비!=null?((C.금주_대비>=0?"+":"")+fmtI(C.금주_대비)):"—";
document.getElementById("week").innerHTML=`
<table class="data"><thead><tr><th>주</th><th>기간</th><th class="num">일평균</th><th class="num">월</th><th class="num">화</th><th class="num">수</th><th class="num">목</th><th class="num">금</th><th class="num">토</th></tr></thead>
<tbody>${rows}</tbody></table>
<p class="sub" style="margin:10px 0 6px">비교 · 완료주평균 <b>${cell(C.완료주_평균)}</b> (최고 ${cell(C.완료주_최고)} / 최저 ${cell(C.완료주_최저)}) · 금주 대비 <b>${vs}</b></p>
<table class="data"><thead><tr><th>대비</th><th class="num">값</th></tr></thead><tbody>
<tr><td>완료주 평균 (금주 제외 ${C.완료주_수||0}주)</td><td class="num">${cell(C.완료주_평균)}</td></tr>
<tr><td>금주 일평균</td><td class="num">${cell(C.금주_일평균)}</td></tr>
<tr><td>금주 − 완료주평균</td><td class="num"><b>${vs}</b></td></tr>
</tbody></table>
<h3 style="margin:16px 0 8px;font-size:14px;color:var(--navy)">금주 진행 현황 <span class="badge info">${G.기간약||""} · ${G.진행||""}</span></h3>
<table class="data"><thead><tr><th>요일</th><th>날짜</th><th>상태</th><th class="num">수량</th></tr></thead><tbody>${prog}</tbody></table>
<p class="sub" style="margin-top:8px">금주 일평균 <b>${cell(G.일평균)}</b> · 완료주평균 대비 <b>${vs}</b> · 규칙: ${W.rule||""}</p>`;

let mode="recent3w";
function recent3wSeries(){
  const set=new Set([...(W.앞선2주_dates||[]),...(W.이번주_dates||[])]);
  return (D.daily_product||[]).filter(x=>set.has(x.date));
}
function series(){
  if(mode==="month") return D.month_daily_product||[];
  if(mode==="recent3w") return recent3wSeries();
  return D.daily_product||[];
}
function renderChart(){
  const s=series();
  const chart=document.getElementById("chart"); chart.innerHTML="";
  if(!s.length){ document.getElementById("chartMeta").textContent="데이터 없음"; return; }
  const n=s.length;
  const vals=s.map(x=>+x.product_proxy||0);
  const vmax=Math.max(1,...vals);
  const padL=36, padR=12, padT=28, padB=36;
  const Wsvg=Math.max(520, n*48);
  const H=220;
  const iw=Wsvg-padL-padR, ih=H-padT-padB;
  const xAt=i=>padL+(n===1?iw/2:(i/(n-1))*iw);
  const yAt=v=>padT+ih-(v/vmax)*ih;
  const lineCls=mode==="month"?"line mo":(mode==="recent3w"?"line wk":"line");
  const dotBase=mode==="month"?"dot mo":(mode==="recent3w"?"dot wk":"dot");
  const w2=new Set(W.앞선2주_dates||[]);
  const tw=new Set(W.이번주_dates||[]);
  let pts="";
  vals.forEach((v,i)=>{ pts+=`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)} `; });
  let grid="";
  for(let g=0;g<=4;g++){
    const yy=padT+(ih*g/4);
    const gv=Math.round(vmax*(1-g/4));
    grid+=`<line class="grid" x1="${padL}" y1="${yy}" x2="${Wsvg-padR}" y2="${yy}"/>`;
    grid+=`<text class="seg-note" x="4" y="${yy+3}">${gv}</text>`;
  }
  let dots="";
  s.forEach((x,i)=>{
    const v=+x.product_proxy||0;
    const cx=xAt(i), cy=yAt(v);
    let dc=dotBase;
    if(mode==="recent3w" && w2.has(x.date)) dc="dot w2";
    if(mode==="recent3w" && tw.has(x.date)) dc="dot wk";
    dots+=`<circle class="${dc}" cx="${cx}" cy="${cy}" r="4"><title>${x.date}: ${v}</title></circle>`;
    dots+=`<text class="vlab" x="${cx}" y="${cy-10}" text-anchor="middle">${fmt(v)}</text>`;
    dots+=`<text class="dlab" x="${cx}" y="${H-10}" text-anchor="middle">${x.label||dlab(x.date)}</text>`;
  });
  chart.innerHTML=`<svg viewBox="0 0 ${Wsvg} ${H}" width="${Wsvg}" height="${H}" role="img" aria-label="일별 애리후세 꺾은선">${grid}<polyline class="${lineCls}" points="${pts.trim()}"/>${dots}</svg>`;
  let meta=`${s[0].date} ~ ${s[s.length-1].date} · ${s.length}일 · 수량 볼드 · 꺾은선`;
  if(mode==="recent3w") meta+=` · 앞선2주(${(W.앞선2주_dates||[]).length}일)+이번주(${(W.이번주_dates||[]).length}일)`;
  document.getElementById("chartMeta").textContent=meta;
}
const tabs=document.getElementById("tabs");
[["recent3w","최근3주(월~토)"],["month","이번달"],["all","전체"]].forEach(([k,lab])=>{
  const b=document.createElement("button"); b.textContent=lab; b.className=k===mode?"on":"";
  b.onclick=()=>{mode=k;[...tabs.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");renderChart();renderBots();renderProcs();};
  tabs.appendChild(b);
});
function renderBots(){
  const list=mode==="month"?(D.month_bottlenecks||[]):(D.bottlenecks||[]);
  document.getElementById("bots").innerHTML=`<table class="data"><thead><tr><th class="num">순위</th><th>공정</th><th class="num">하루평균</th><th class="num">기록일수</th></tr></thead><tbody>`+
    list.map(r=>`<tr><td class="num">${r.rank}</td><td>${r["공정"]}</td><td class="num">${fmt(r.mean)}</td><td class="num">${r.n}</td></tr>`).join("")+`</tbody></table>`;
}
function renderProcs(){
  const list=mode==="month"?(D.month_processes||[]):(D.processes||[]);
  const pmax=Math.max(1,...list.map(x=>x.mean||0));
  document.getElementById("procs").innerHTML=`<table class="data"><thead><tr><th>공정</th><th class="num">기록일수</th><th class="num">하루평균</th><th>분포</th></tr></thead><tbody>`+
    list.map(p=>`<tr><td>${p["공정"]}${p["공정"]==="애리후세"?" ★":""}</td><td class="num">${p.n}</td><td class="num">${fmt(p.mean)}</td>
      <td><div class="barwrap"><div class="bar"><i style="width:${(p.mean/pmax)*100}%"></i></div></div></td></tr>`).join("")+`</tbody></table>`;
}
renderChart(); renderBots(); renderProcs();


(function(){
  const P=D["마이바스_애리지누이"]; if(!P) return;
  const o=P.overall||{}, m=P.month||{};
  const mb=o["마이바스"]||{}, aj=o["애리지누이"]||{};
  const mm=m["마이바스"]||{}, am=m["애리지누이"]||{};
  const elK=document.getElementById("pairKpis"); if(!elK) return;
  elK.innerHTML=`
    <div class="kpi"><div class="lbl">기준 마이바스 하루평균</div><div class="val">${fmt(mb.mean)}</div><div class="meta">기록 ${fmt(mb.n)}일 · min ${fmt(mb.min)} · max ${fmt(mb.max)}</div></div>
    <div class="kpi"><div class="lbl">애리지누이 하루평균</div><div class="val">${fmt(aj.mean)}</div><div class="meta">기록 ${fmt(aj.n)}일 · min ${fmt(aj.min)} · max ${fmt(aj.max)}</div></div>
    <div class="kpi"><div class="lbl">이번달 마이바스</div><div class="val">${fmt(mm.mean)}</div><div class="meta">${m.label||""} · ${fmt(mm.n)}일</div></div>
    <div class="kpi"><div class="lbl">이번달 애리지누이</div><div class="val">${fmt(am.mean)}</div><div class="meta">${m.label||""} · ${fmt(am.n)}일</div></div>`;
  const rows=(P.daily||[]).slice().reverse().map(r=>{
    const diff=r["차이_애리빼기마이바스"];
    return `<tr>
    <td>${r.label||r.date}</td>
    <td class="num"><b>${r["마이바스"]==null?"—":fmtI(r["마이바스"])}</b></td>
    <td class="num">${r["애리지누이"]==null?"—":fmtI(r["애리지누이"])}</td>
    <td class="num">${diff==null?"—":((diff>=0?"+":"")+fmtI(diff))}</td>
  </tr>`;}).join("");
  const ds=o["차이_애리빼기마이바스"]||{};
  document.getElementById("pair").innerHTML=`
    <p class="sub">${P.rule||""} · 동시기록 ${fmt(o["동시기록일"])}일 · 차이평균(애리−마이바스) ${fmt(ds.mean)}</p>
    <table class="data"><thead><tr><th>날짜</th><th class="num">마이바스★</th><th class="num">애리지누이</th><th class="num">차이</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
})();
(function(){
  const L=D["공정지연_마이바스"]; if(!L) return;
  const el=document.getElementById("delay"); if(!el) return;
  const mb=L["마이바스"]||{};
  const rows=(L["연동"]||[]).map(r=>{
    const rc=r["상관_vs_마이바스"];
    const badge=rc==null?"":(rc>=0.5?'<span class="badge ok">연동강</span>':(rc>=0.3?'<span class="badge info">연동중</span>':'<span class="badge warn">약함</span>'));
    return `<tr>
      <td>${r["공정"]}${r["공정"]==="마이바스"?" ★":""}</td>
      <td class="num">${fmt(r["하루평균"])}</td>
      <td class="num">${fmt(r["기록일수"])}</td>
      <td class="num">${rc==null?"—":rc} ${badge}</td>
      <td class="num">${fmt(r["동시일수"])}</td>
      <td class="num">${r.delta==null?"—":fmt(r.delta)}</td>
    </tr>`;
  }).join("");
  el.innerHTML=`
    <p class="sub"><b>기준=${L["기준공정"]}</b> · ${L["가설"]||""}<br>${L.rule||""} · 마이바스 하루평균 ${fmt(mb.mean)} (n=${fmt(mb.n)}) · delta=마이바스 낮을 때 상대공정 평균 − 높을 때</p>
    <table class="data"><thead><tr><th>공정</th><th class="num">하루평균</th><th class="num">기록일수</th><th class="num">상관(vs마이바스)</th><th class="num">동시일</th><th class="num">delta</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
})();
document.getElementById("foot").textContent=`애리후세 · 초단기준 마이바스 · 주간 월~토 · 갱신 ${D.updated||""}`;

</script>
